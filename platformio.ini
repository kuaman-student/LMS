[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -I include
    -DEXTERNAL=0
    -D"analogReference(x)=((void)0)"

lib_deps =
    Wire
    https://github.com/Techgeeks-store/ARC16-Sensor-Library.git

    links2004/WebSockets @ ^2.4.1